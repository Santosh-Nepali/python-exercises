<!-- The <script> tag is in the <head>, so the browser runs script_3.js before it has built the <body>. 
    When the code reaches document.querySelector("#additionValue"), that element doesn’t exist yet.
    The result is null, and setting .innerHTML on null throws an error, so nothing is displayed.
    we can confirm this by opening DevTools (right-click, Inspect, Console tab). 
    We should see something like:
        Uncaught TypeError: Cannot set properties of null (setting 'innerHTML')
    The prompts probably appear on a blank white page for the same reason: the page hasn’t been drawn yet. 
    defer tells the browser to download the script immediately but run it only after the whole HTML is parsed. 
Alternative: we can also move the script to the end of the body.
